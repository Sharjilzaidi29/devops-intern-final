name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck on scripts
        run: shellcheck scripts/*.sh
      - name: Hadolint on Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < app/Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t devops-intern-final:ci app/
      - name: Save image to a file
        run: docker save devops-intern-final:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      - name: Start container
        run: docker run -d --name app -p 8080:8080 devops-intern-final:ci
      - name: Wait until ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/healthz > /dev/null; then
              echo "Ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Run healthcheck script
        run: ./scripts/healthcheck.sh http://localhost:8080

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag and push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag devops-intern-final:ci "$IMAGE:${{ github.sha }}"
          docker tag devops-intern-final:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"